<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>内容管理 / 微光计划</title><link rel="stylesheet" href="theme.css" /><link rel="stylesheet" href="auth.css" /></head><body class="account-page"><main class="account-shell"><a class="auth-back" href="index.html">← 返回网站</a><div class="account-head"><div><p class="overline">ADMIN / CONTENT OPERATIONS</p><h1>内容现场。</h1></div><p class="auth-status" data-admin-status role="status"></p></div><section class="admin-section"><form class="auth-form admin-form" data-admin-form><h2>新增项目</h2><label>项目 slug<input name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" /></label><label>项目名称<input name="title" required /></label><label>副标题<input name="subtitle" /></label><label>地点<input name="location" /></label><label>类别<input name="category" /></label><label>摘要<textarea name="summary" rows="3"></textarea></label><label>完整描述<textarea name="description" rows="5"></textarea></label><label>封面图片 URL<input name="cover_image" type="url" /></label><label>状态<input name="status" value="进行中" /></label><label>进度<input name="progress" type="number" min="0" max="100" value="0" /></label><label>受益对象<input name="beneficiaries" /></label><label><input name="published" type="checkbox" /> 立即公开</label><button type="submit">保存项目</button></form><div class="admin-list"><h2>已录入项目</h2><div class="table-wrap"><table><thead><tr><th>名称</th><th>slug</th><th>状态</th><th>操作</th></tr></thead><tbody data-admin-table></tbody></table></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script><script src="admin.js"></script></body></html>
